name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node scripts/verify-scaffold.test.mjs
      - run: node scripts/verify-phase0.test.mjs
      - run: pnpm test
      - run: pnpm test:exit
      # Phase 11 (PLAN 18 #14): the build must compile and the production
      # dependency tree must stay free of known critical vulnerabilities.
      - run: pnpm build
      - run: pnpm audit --prod --audit-level critical
      - run: node scripts/verify-phase1.test.mjs
      - run: node scripts/verify-phase2.test.mjs
      - run: node scripts/verify-phase3.test.mjs
      - run: node scripts/verify-phase4.test.mjs
      - run: node scripts/verify-phase5.test.mjs
      - run: node scripts/verify-phase6.test.mjs
      - run: node scripts/verify-phase7.test.mjs
      - run: node scripts/verify-phase8.test.mjs
      - run: node scripts/verify-phase9a.test.mjs
      - run: node scripts/verify-phase9b.test.mjs
      - run: node scripts/verify-phase10.test.mjs
      - run: node scripts/verify-phase10-migration.mjs
      - run: node scripts/verify-phase11.test.mjs
  pg:
    # Phase 12: the PostgreSQL-backed DbPort must pass its parity and
    # concurrency suites against a real Postgres on every push.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI's service publishes on 5432; the harness default targets the local
      # compose port 5433, so point it at the service.
      - run: pnpm --filter @pos/api exec vitest run --config vitest.pg.config.ts
        env:
          PGTEST_BASE: postgres://pos:pos@localhost:5432
      - run: node scripts/verify-phase12.test.mjs
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Phase 12: the browser workflows run against the PostgreSQL-backed API,
      # the same configuration production uses.
      - run: node scripts/apply-migrations.mjs
        env:
          DATABASE_URL: postgres://pos:pos@localhost:5432/pos
      - run: npx playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          DATABASE_URL: postgres://pos:pos@localhost:5432/pos
