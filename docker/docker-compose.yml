services:
  db:
    image: postgres:16-alpine
    container_name: pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - 5432:5432
    volumes:
      - pos-data:/var/lib/postgresql/data
volumes:
  pos-data:
