services:
  db:
    image: postgres:16-alpine
    container_name: pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      # 5432 is routinely taken by other local projects' Postgres instances;
      # the POS database lives on 5433 so both can run side by side.
      - "5433:5432"
    volumes:
      - pos-data:/var/lib/postgresql/data
volumes:
  pos-data:
