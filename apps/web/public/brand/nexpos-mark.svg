<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="NexPOS mark">
  <rect x="0" y="0" width="48" height="48" rx="11" fill="#F35D3F"/>
  <rect x="0" y="0" width="48" height="22" rx="11" fill="#FFFFFF" opacity="0.09"/>
  <rect x="0" y="16" width="48" height="6" fill="#D94A30" opacity="0.22"/>
  <!-- Receipt-N: bold N built from receipt strips -->
  <path d="M14 12.5h6.6L27.4 28V12.5H34v23h-6.6L20.6 20v15.5H14v-23Z" fill="#FFFFFF"/>
  <!-- fold shadow on the diagonal -->
  <path d="M20.6 12.5l6.8 15.5v3.2l-8.5-17.3 1.7-1.4Z" fill="#D94A30" opacity="0.85"/>
  <!-- receipt teeth: two coral notches cut from the top of the stems -->
  <path d="M15.6 12.5 17.3 15 19 12.5H15.6Z" fill="#F35D3F"/>
  <path d="M30 12.5l1.7 2.5 1.7-2.5H30Z" fill="#F35D3F"/>
