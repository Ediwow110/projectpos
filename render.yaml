# Render Blueprint for the free-tier deployment.
#
#   Render dashboard → New → Blueprint → connect this repository, then fill
#   the sync:false values (DATABASE_URL, BREVO_API_KEY, EMAIL_FROM,
#   PAYMONGO_SECRET_KEY, PAYMONGO_WEBHOOK_SECRET) in the dashboard when
#   prompted. Secret values are never stored in git.
#
# Design constraints this file encodes:
# - PostgreSQL lives in Supabase's free tier (Render's own free Postgres
#   expires after 30 days). Use the Session pooler connection string —
#   Supabase direct connections are IPv6-only, which Render cannot reach.
#   Free-tier caveat: Supabase pauses a project after 7 days of inactivity;
#   a POS in daily use never triggers this (restoring is one dashboard
#   click and no data is lost). The API applies pending migrations at boot
#   via the idempotent _migrations ledger, so first boot and every redeploy
#   are safe.
# - Free plans block outbound SMTP (25/465/587), so email uses the Brevo
#   HTTPS transport: set BREVO_API_KEY and do NOT set SMTP_* variables
#   (the API refuses a configuration with both transports).
# - onrender.com is a public suffix, so the generated web/API hostnames are
#   different sites for SameSite cookie rules. The browser therefore calls
#   /api/* on the web origin; Next.js proxies those requests over Render's
#   private network to the API service. This keeps session/CSRF cookies
#   first-party without switching them to SameSite=None.
# - WEB_URL is the only public web origin stored in this Blueprint. The web
#   service copies it for NEXT_PUBLIC_API_BASE, while API_PROXY_TARGET is
#   derived from the API service's private host:port.
services:
  - type: web
    name: nexpos-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /readyz
    autoDeploy: true
    dockerCommand: sh -c "cd /app && node scripts/apply-migrations.mjs && cd apps/api && exec node --import tsx src/main.ts"
    envVars:
      - key: NODE_ENV
        value: production
      # Render routes web traffic to $PORT (10000 on free plans).
      - key: API_PORT
        value: "10000"
      - key: WEB_URL
        value: https://nexpos-web.onrender.com
      - key: AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "1"
      # Supabase free tier is small; keep the pool modest.
      - key: PG_POOL_MAX
        value: "10"
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false

  - type: web
    name: nexpos-web
    runtime: docker
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: ./
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render exposes service env vars as Docker build args too. Copy the
      # canonical public web origin instead of repeating it here.
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: nexpos-api
          envVarKey: WEB_URL
      # hostport is the API's stable private-network address. next.config.js
      # normalizes the bare host:port to http:// for the server-side rewrite.
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: nexpos-api
          property: hostport
